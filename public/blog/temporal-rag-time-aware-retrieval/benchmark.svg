<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Temporal benchmark</title><desc id="desc">Historical cases test reference time, valid evidence, corrections, and uncertainty.</desc>
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.7"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#172535" flood-opacity=".16"/></filter>
    <style>
      .ink{stroke:#172535;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;}
      .thin{stroke:#172535;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
      .label{font-family:ui-sans-serif,system-ui,sans-serif;fill:#172535;font-weight:800;letter-spacing:.5px}
      .small{font-family:ui-sans-serif,system-ui,sans-serif;fill:#172535;font-size:25px;font-weight:600}
      .arrow{fill:none;stroke:#172535;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowhead)}
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#172535"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f8f4e9"/>
  <path d="M0 120 C300 75 530 145 820 98 S1320 105 1600 75" fill="none" stroke="#d8d1bd" stroke-width="18" opacity=".55"/>
  <path d="M30 820 C360 770 640 850 930 800 S1330 835 1570 775" fill="none" stroke="#d8d1bd" stroke-width="14" opacity=".45"/>
  <g filter="url(#wobble)"><path d="M180 620 L1420 620" class="ink"/><path d="M330 590 L330 650 M680 590 L680 650 M1030 590 L1030 650 M1330 590 L1330 650" class="ink"/><rect x="230" y="360" width="250" height="120" rx="24" fill="#d9a441" class="ink"/><rect x="540" y="300" width="300" height="150" rx="24" fill="#3b8f8b" class="ink"/><rect x="900" y="390" width="250" height="120" rx="24" fill="#d76b58" class="ink"/><rect x="1200" y="300" width="250" height="150" rx="24" fill="#7fb4c8" class="ink"/><text x="355" y="430" text-anchor="middle" class="label" font-size="32">QUERY</text><text x="690" y="390" text-anchor="middle" class="label" font-size="32">VALID EVIDENCE</text><text x="1025" y="460" text-anchor="middle" class="label" font-size="32">CONFLICT</text><text x="1325" y="390" text-anchor="middle" class="label" font-size="32">ANSWER</text><path d="M480 420 C470.0 352.5 550.0 442.5 540 375" class="arrow"/><path d="M840 380 C830.0 360.0 910.0 450.0 900 430" class="arrow"/><path d="M1150 430 C1135.0 357.5 1215.0 447.5 1200 375" class="arrow"/></g>
</svg>